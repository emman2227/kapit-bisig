[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:python-ai]
directory=/app/backend
command=uvicorn main:app --host 0.0.0.0 --port 8000
environment=MALLOC_ARENA_MAX="2"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:node-server]
directory=/app/apps/web/apps
command=node --max-old-space-size=256 dist/index.js
environment=PYTHON_BACKEND_URL="http://127.0.0.1:8000",MALLOC_ARENA_MAX="2"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
